name: Verify LinkageLens
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: JVM and MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and package the CLI
        shell: bash
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Compare the three reports with the JVM
        run: python checks/checkout_smoke.py --install-dir build/install/linkagelens
      - name: Diagnose a caller compiled against SLF4J 2 with SLF4J 1 first at runtime
        run: python checks/slf4j_smoke.py --install-dir build/install/linkagelens
      - name: Create evidence for the MCP client
        shell: bash
        run: build/install/linkagelens/bin/linkagelens demo --out build/mcp-demo
      - name: Install official MCP client
        run: python -m pip install --disable-pip-version-check mcp==1.26.0
      - name: Query each report through stdio
        shell: bash
        run: |
          for case_name in broken reordered fixed; do
            python checks/mcp_smoke.py --install-dir build/install/linkagelens --report "build/mcp-demo/$case_name/report.json"
          done
      - name: Save test results and demo evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/test-results/test/*.xml
            build/mcp-demo/*/report.*
